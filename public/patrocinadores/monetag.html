<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Patrocinadores VOTTI</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow: hidden;
        overscroll-behavior: contain;
        background: #0f1729;
        font-family: system-ui, sans-serif;
      }

      /* Página só de propaganda — banner preso aqui dentro */
      #votti-propaganda-page {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 250px;
        padding: 0.5rem;
      }

      #votti-banner-slot {
        display: flex;
        width: 100%;
        max-width: 728px;
        min-height: 90px;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #votti-banner-slot iframe,
      #votti-banner-slot img {
        display: block;
        max-width: 100%;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <main id="votti-propaganda-page" aria-label="Publicidade VOTTI">
      <div id="votti-banner-slot" aria-label="Banner patrocinado"></div>
    </main>
    <!-- Zona banner Monetag 11483021 — só roda nesta página isolada (iframe) -->
    <script>
      (function (s) {
        s.dataset.zone = "11483021";
        s.src = "https://nap5k.com/tag.min.js";
      })(
        document
          .getElementById("votti-banner-slot")
          .appendChild(document.createElement("script")),
      );
    </script>
  </body>
</html>
